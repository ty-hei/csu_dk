[project]
name = "csu-dk"
version = "0.2.0"
description = "中南大学本地打卡控制页与无持久化的单次业务核心"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "requests==2.34.2",
    "pycryptodome==3.23.0",
    "beautifulsoup4==4.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "RUF", "DTZ", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]
